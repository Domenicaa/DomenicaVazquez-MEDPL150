<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bored at Home</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #E9DCB0;
      padding: 40px;
    }

    #story {
      max-width: 600px;
      margin: auto;
      background: #EAC2D6;
      padding: 30px;
      border-radius: 10px;
    }

    h1 {
      font-size: 24px;
      line-height: 1.3;
    }

    img {
      width: 100%;
      border-radius: 10px;
      margin: 15px 0;
    }

    button {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #D8DDE4;
      transition: background-color 0.15s ease;
    }

    /* Theme hover colors */
    button.park:hover { background-color: #E2EB9C; }
    button.cook:hover { background-color: #D49EEA; }

    .choice-block {
      margin-bottom: 22px;
    }

    /* Optional: make the "Next" button a little special but still simple */
    button.next {
      font-weight: bold;
    }
      /* Layout for choices */
  #choices {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  /* Two-column layout when there are multiple choices */
  #choices.two-columns {
    grid-template-columns: 1fr 1fr;
  }

  .choice-block img {
    margin-top: 10px;
  }

  </style>
</head>

<body>
  <div id="story">
    <h1 id="text"></h1>
    <img id="sceneImg" alt="" style="display:none;">
    <div id="choices"></div>
  </div>

  <script>
    const story = {
      intro: {
        text: "You are bored at home.",
        image: "bored.png",
        choices: [
          { text: "Next", next: "choose", className: "next" }
        ]
      },

      choose: {
        text: "What do you want to do?",
        choices: [
          {
            text: "Go to the park",
            next: "park",
            theme: "park",
            image: "park.png"
          },
          {
            text: "Cook a recipe",
            next: "cook",
            theme: "cook",
            image: "recipe.png"
          }
        ]
      },

      /* PARK PATH */
      park: {
        text: "You go to the park.",
        theme: "park",
        choices: [
          { text: "Play basketball", next: "win", image: "basketball.png" },
          { text: "Ride a bike", next: "bike", image: "ridingbike.png" }
        ]
      },

      win: {
        text: "You win 🏀",
        theme: "park",
        image: "win.png",
        choices: [{ text: "Restart", next: "intro" }]
      },

      bike: {
        text: "You fall off the bike and hit your face.",
        theme: "park",
        image: "felloff.png",
        choices: [{ text: "Restart", next: "intro" }]
      },

      /* COOK PATH */
      cook: {
        text: "You decide to cook a recipe.",
        theme: "cook",
        choices: [
          { text: "Sweet", next: "sweet", image: "sweett.png" },
          { text: "Savory", next: "savory", image: "savory.png" }
        ]
      },

      sweet: {
        text: "You choose something sweet.",
        theme: "cook",
        choices: [
          { text: "Cheesecake", next: "cheesecake", image: "cheesecake.png" }
        ]
      },

      cheesecake: {
        text: "You put salt instead of sugar.",
        theme: "cook",
        choices: [
          { text: "You cry 😭", next: "cry", image: "salty.png" }
        ]
      },

      savory: {
        text: "You choose something savory.",
        theme: "cook",
        choices: [
          { text: "Ramen", next: "ramen", image: "ramen.png" }
        ]
      },

      ramen: {
        text: "You make it extra spicy.",
        theme: "cook",
        choices: [
          { text: "Perfect 🔥", next: "perfect", image: "eatramen.png" }
        ]
      },

      cry: {
        text: "You cry.",
        choices: [{ text: "Restart", next: "intro" }]
      },

      perfect: {
        text: "Perfect.",
        theme: "cook",
        choices: [{ text: "Restart", next: "intro" }]
      }
    };

    function showScene(scene) {
      const textEl = document.getElementById("text");
      const imgEl = document.getElementById("sceneImg");
      const choicesEl = document.getElementById("choices");

      textEl.textContent = story[scene].text;
      choicesEl.innerHTML = "";
        // Switch to two columns if there is more than one choice
  if (story[scene].choices.length > 1) {
    choicesEl.classList.add("two-columns");
  } else {
    choicesEl.classList.remove("two-columns");
  }


      if (story[scene].image) {
        imgEl.src = story[scene].image;
        imgEl.style.display = "block";
        imgEl.alt = story[scene].text;
      } else {
        imgEl.style.display = "none";
        imgEl.src = "";
        imgEl.alt = "";
      }

      story[scene].choices.forEach(choice => {
        const block = document.createElement("div");
        block.className = "choice-block";

        const button = document.createElement("button");
        button.textContent = choice.text;

        // Theme color: choice.theme overrides scene.theme
        const themeToUse = choice.theme || story[scene].theme;
        if (themeToUse) button.classList.add(themeToUse);

        // Optional extra class for specific buttons like Next
        if (choice.className) button.classList.add(choice.className);

        button.onclick = () => showScene(choice.next);
        block.appendChild(button);

        // Every choice has an image (per your request)
        if (choice.image) {
          const img = document.createElement("img");
          img.src = choice.image;
          img.alt = choice.text;
          block.appendChild(img);
        }

        choicesEl.appendChild(block);
      });
    }

    showScene("intro");
  </script>
</body>
</html>
